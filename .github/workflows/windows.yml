name: Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native Windows app
        shell: pwsh
        run: .\Scripts\package-windows.ps1
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: AgentUsage-Windows
          path: |
            dist/AgentUsage-Windows-*.zip
            dist/AgentUsage-Windows-*.zip.sha256
