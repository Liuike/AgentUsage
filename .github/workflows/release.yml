name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate release metadata
        shell: pwsh
        run: |
          $source = Get-Content -Raw .\Windows\Models.cs
          if ($source -notmatch 'public const string Version = "([^"]+)"') { throw 'Windows version not found.' }
          if ($Matches[1] -ne $env:GITHUB_REF_NAME.TrimStart('v')) { throw 'Tag does not match Windows version.' }
          if (-not (Test-Path -LiteralPath ".\Docs\releases\$env:GITHUB_REF_NAME.md")) { throw 'Release notes not found.' }

      - name: Build and package Windows release
        shell: pwsh
        run: .\Scripts\package-windows.ps1

      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem .\dist\AgentUsage-Windows-*.zip* | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --notes-file ".\Docs\releases\$env:GITHUB_REF_NAME.md" --title "AgentUsage $env:GITHUB_REF_NAME"
